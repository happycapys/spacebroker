[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/market"
  to = "/.netlify/functions/market"
  status = 200

[[redirects]]
  from = "/api/wallet-nfts"
  to = "/.netlify/functions/wallet-nfts"
  status = 200

[[redirects]]
  from = "/api/rarity-snapshot"
  to = "/.netlify/functions/rarity-snapshot"
  status = 200
